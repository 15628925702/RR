# Phase 1 integrity/corruption validation only. Never use as a paper result.
p4:
  schema_version: p4-phase1-config-v2
  not_formal: true
  experiment_mode: finite_lu_rejection
  exact_observed_score: false
  sandwich_benchmark: true
  conditional_method: rejection
  budgets: [2000, 4000, 8000, 16000, 32000]
  replications: 50
  policies: ["Uniform SQD", "A-OSQD", "oracle RR-GID"]
  target_manifest: experiments/p4_target_draw_manifest.json
  pilot_schedule:
    kind: power
    exponent: 0.3333333333333333
    multiplier: 10.0
    max_fraction: 1.0
    min_per_support: 1
    rounding_rule: ceil
  mixture_seed: 2026
  alpha: 1.0
  reference_size: 50000
  large_reference_size: 200000
  information_tilted_samples: 256
  information_conditional_samples: 32
  information_method: cross_completion_rejection
  h_tilted: 128
  h_cond: 32
  kl_samples: 20000
  pilot_norm_cap: 2.0
  scoring_steps: 2
  frozen_beta_star_information: false
  kl_mu_direct: true
  theta_norm_cap: null
  theta_l1_cap: null
  scoring_step_size: 1.0
  scoring_max_step_norm: null
  lu_schedule:
    kind: log2
    scale: 32.0
    offset: 1.0
  integration_tolerance: 1.0e-8
  design_ratio_tolerance: 1.0e-10
  fw_tolerance: 1.0e-6
