seed: 2026
device: cpu
dtype: float64
paths:
  root: ..
  data: data
  results: results
  figures: figures
  experiments: experiments
p4:
  alpha: 1.0
  budgets: [2000, 4000, 8000, 16000, 32000]
  pilot_multiplier: 10.0
  scoring_steps: 2
  replications: 200
  target_ess_fraction: 0.5
  information_tilted_samples: 256
  information_conditional_samples: 32
  # PDF Alg.2 step 6: H is re-estimated by cross-completion at each beta^(j).
  # Internal Monte Carlo sizes.  The growth rules below make update-stage
  # information error decrease with budget; fixed sizes are diagnostic-only.
  pilot_norm_cap: null
  # PDF S1 requires exact observed scores, or L_U,B -> infinity.  The formal
  # runner therefore derives L_U(B)=B; fixed --lu is diagnostic-only.
  exact_observed_score: true
  lu_scale: 1.0
  # Formal P4 uses the PDF TiltCond oracle: exact GMM conditional proposal
  # followed by bounded exponential-tilt rejection. QMC remains diagnostic.
  conditional_method: rejection
  qmc_order: 10
  qmc_start_order: 8
  qmc_max_order: 16
  # Engineering tolerance for the deterministic conditional integral; PDF
  # leaves this numerical tolerance open.  Every run records the nested-QMC
  # terminal delta and fails if this certificate is not met.
  qmc_atol: 1.0e-4
  qmc_rtol: 1.0e-3
  # Conditional-score QMC resolution grows with LU/B; diagnostic probes showed
  # fixed order 10 is insufficient at B=32000.
  qmc_order_growth: null
  # Frozen after B=2000 paired repair: lower H caused a 25% B.KL bias.
  # These growth rules keep the conditional-information error decreasing.
  # Explicit finite MC sizes; the PDF fixes the conditional-law interface and
  # Eq. (9), not a QMC order or a budget-dependent quadrature schedule.
  h_tilted: 128
  h_cond: 32
  h_tilted_growth: null
  h_cond_growth: null
  kl_samples: 2000
  theta_bound: 4.0
  # Compact Theta projection required by PDF Algorithm 2.  The radius is an
  # engineering parameter (PDF leaves the numeric boundary open) and is
  # frozen here before formal replications.
  theta_norm_cap: 4.0
  # L1 envelope bound keeps exact TiltCond acceptance numerically viable;
  # frozen beta* has ||beta*||_1 ~= 4.505 and remains inside this set.
  theta_l1_cap: 5.0
  # Fixed damping for finite-sample Fisher scoring; the PDF leaves numerical
  # line-search details open, while the update target remains Eq. (Algorithm 2).
  # Full Fisher-scoring steps are required for the P4 asymptotic gate.  A
  # finite trust radius only limits pathological Monte Carlo directions.
  scoring_step_size: 1.0
  scoring_max_step_norm: null
  # PDF Algorithm 2 step 6 re-estimates I_S(beta^(j)) at every update.  The
  # frozen beta* information is used only for the oracle allocation and its
  # horizontal theory line, never as the update-stage Hessian.
  use_oracle_H: false
  # Evaluate KL as one internally consistent reference-pool Bregman
  # divergence.  Mixing an independently sampled target mean with A_R creates
  # a first-order Monte Carlo term and invalidates the B*KL convergence gate.
  kl_mu_direct: false
  ridge: null
  reference_size: 200000
  # High-precision artifact used by the repaired route; the old 200k artifact
  # remains preserved for comparison and is not accepted by this configuration.
  large_reference_size: 1000000
  fw_tolerance: 1.0e-6
  paired_target_manifest: experiments/p4_target_draw_manifest.json
