seed: 2026
device: cpu
dtype: float64
paths:
  root: ..
  data: data
  results: results
  figures: figures
  experiments: experiments
p4:
  alpha: 1.0
  budgets: [2000, 4000, 8000, 16000, 32000]
  pilot_multiplier: 10.0
  scoring_steps: 2
  replications: 200
  target_ess_fraction: 0.5
  information_tilted_samples: 256
  information_conditional_samples: 32
  # PDF Alg.2 step 6: H is re-estimated by cross-completion at each beta^(j).
  # These are internal Monte Carlo sizes (PDF Sec. 9.1 lists them as open), chosen
  # so that the S1 exact-conditional-oracle gate is numerically stable.
  pilot_norm_cap: null
  lu: 128
  h_tilted: 128
  h_cond: 32
  kl_samples: 20000
  theta_bound: 4.0
  # Compact Theta projection required by PDF Algorithm 2.  The radius is an
  # engineering parameter (PDF leaves the numeric boundary open) and is
  # frozen here before formal replications.
  theta_norm_cap: 2.0
  # Fixed damping for finite-sample Fisher scoring; the PDF leaves numerical
  # line-search details open, while the update target remains Eq. (Algorithm 2).
  scoring_step_size: 0.25
  ridge: null
  large_reference_size: 200000
  fw_tolerance: 1.0e-6
  paired_target_manifest: experiments/p4_target_draw_manifest.json
