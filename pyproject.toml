[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rr-gid-cn"
version = "0.1.0"
description = "Reference-Relative Generative Information Design"
requires-python = ">=3.10,<3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
rr-gid-cn = "rr_gid_cn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

